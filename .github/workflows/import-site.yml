name: Import BEE SMART site

on:
  push:
    paths:
      - bee-smart-site.tar.gz.part-*

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Expand verified site source
        run: |
          cat bee-smart-site.tar.gz.part-* > bee-smart-site.tar.gz
          tar -xzf bee-smart-site.tar.gz
          rm bee-smart-site.tar.gz
          rm bee-smart-site.tar.gz.part-*
          rm .github/workflows/import-site.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Completar sitio web BEE SMART"
          git push
